name: Release after merge

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  RELEASE_RUST: "1.97.1"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  validate:
    name: Validate release version and source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_needed: ${{ steps.version.outputs.release_needed }}
    steps:
      - name: Checkout merged main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the crate version and detect an existing release
        id: version
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v$version already exists; this merge does not create another release."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install exact Rust toolchain
        if: steps.version.outputs.release_needed == 'true'
        run: rustup toolchain install "$RELEASE_RUST" --profile minimal --component rustfmt,clippy
      - name: Install exact dependency-policy tools
        if: steps.version.outputs.release_needed == 'true'
        run: |
          cargo "+$RELEASE_RUST" install cargo-audit --version "=$CARGO_AUDIT_VERSION" --locked
          cargo "+$RELEASE_RUST" install cargo-deny --version "=$CARGO_DENY_VERSION" --locked
          cargo "+$RELEASE_RUST" install cargo-cyclonedx --version "=$CARGO_CYCLONEDX_VERSION" --locked
      - name: Run locked release checks
        if: steps.version.outputs.release_needed == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo "+$RELEASE_RUST" fmt --all -- --check
          cargo "+$RELEASE_RUST" clippy --all-targets --all-features --locked -- -D warnings
          cargo "+$RELEASE_RUST" test --all-features --locked
          cargo "+$RELEASE_RUST" test --release --all-features --locked
          cargo "+$RELEASE_RUST" doc --no-deps --all-features --locked
          cargo "+$RELEASE_RUST" test --all-features --locked --offline
          cargo "+$RELEASE_RUST" fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo "+$RELEASE_RUST" check --manifest-path fuzz/Cargo.toml --locked --features afl --bins
          cargo "+$RELEASE_RUST" audit --file Cargo.lock --deny warnings
          cargo "+$RELEASE_RUST" audit --file fuzz/Cargo.lock --deny warnings
          cargo "+$RELEASE_RUST" deny --manifest-path Cargo.toml --config deny.toml --locked check
          cargo "+$RELEASE_RUST" deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check
          git diff --check
      - name: Install the pinned cargo-afl runtime and driver
        if: steps.version.outputs.release_needed == 'true'
        run: cargo "+$RELEASE_RUST" install cargo-afl --version '=0.18.2' --locked
      - name: Build both real AFL targets
        if: steps.version.outputs.release_needed == 'true'
        run: >-
          cargo "+$RELEASE_RUST" afl build
          --manifest-path fuzz/Cargo.toml
          --locked --features afl --release --bins
      - name: Run the five-minute combined AFL release smoke
        if: steps.version.outputs.release_needed == 'true'
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_SKIP_CPUFREQ: "1"
        run: |
          cargo "+$RELEASE_RUST" afl fuzz -i fuzz/corpus/header -o "${RUNNER_TEMP}/header-out" -V 150 -- fuzz/target/release/header_afl
          cargo "+$RELEASE_RUST" afl fuzz -i fuzz/corpus/structure -o "${RUNNER_TEMP}/structure-out" -V 150 -- fuzz/target/release/structure_afl
      - name: Generate the CycloneDX dependency inventory
        if: steps.version.outputs.release_needed == 'true'
        run: |
          cargo "+$RELEASE_RUST" cyclonedx --format json --all-features
          mv encryptor.cdx.json "chacha20_poly1305-v${{ steps.version.outputs.version }}.cdx.json"
      - name: Upload the dependency inventory
        if: steps.version.outputs.release_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: chacha20_poly1305-v${{ steps.version.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build unsigned ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.release_needed == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout merged main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and target
        run: |
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          rustup target add --toolchain "$RELEASE_RUST" "$TARGET"
      - name: Install the Linux musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build the locked release binary
        run: cargo "+$RELEASE_RUST" build --release --locked --target "$TARGET" --bin chacha20_poly1305
      - name: Exercise the exact release binary
        run: >-
          python3 scripts/release_e2e.py
          "target/${TARGET}/release/chacha20_poly1305"
          "$VERSION"
      - name: Package the unsigned binary
        run: |
          archive="chacha20_poly1305-v${VERSION}-${TARGET}.tar.gz"
          mkdir -p package dist
          cp "target/${TARGET}/release/chacha20_poly1305" package/chacha20_poly1305
          tar -C package -czf "dist/$archive" chacha20_poly1305
      - name: Upload the exact platform archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/chacha20_poly1305-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    if: needs.validate.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download the exact platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create the tag and release for this merged version
        run: >-
          gh release create "v$VERSION"
          dist/*.tar.gz
          dist/*.json
          dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --generate-notes
          --title "v$VERSION"
