name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    name: Rust 1.97.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --all-features --locked
      - name: Release-mode test
        run: cargo +1.97.1 test --release --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --no-deps --all-features --locked
      - name: Prepared-cache offline test
        run: cargo +1.97.1 test --all-features --locked --offline
      - name: Reject whitespace and conflict-marker errors
        run: git diff --check

  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned actionlint source
        run: go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
      - name: Install checksum-pinned ShellCheck 0.11.0
        run: |
          curl --fail --show-error --silent --location \
            --output "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Validate workflows and embedded shell
        run: actionlint -shellcheck shellcheck

  fuzz-build:
    name: AFL target build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Compile real AFL targets
        run: |
          cargo +1.97.1 fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo +1.97.1 check --manifest-path fuzz/Cargo.toml --locked --features afl --bins

  stable-canary:
    name: Moving stable canary
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update moving stable
        run: rustup update stable --profile minimal
      - name: Compatibility check
        run: cargo +stable check --all-targets --all-features --locked
