name: Weekly AFL fuzzing

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: ${{ matrix.target }} / 10 minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: header_afl
            corpus: header
          - target: structure_afl
            corpus: structure
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install the exact cargo-afl runtime and driver
        run: cargo +1.97.1 install cargo-afl --version '=0.18.2' --locked
      - name: Build the real AFL target
        run: >-
          cargo +1.97.1 afl build
          --manifest-path fuzz/Cargo.toml
          --locked --features afl --release
          --bin "${{ matrix.target }}"
      - name: Run the committed corpus for ten minutes
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_SKIP_CPUFREQ: "1"
        run: >-
          cargo +1.97.1 afl fuzz
          -i "fuzz/corpus/${{ matrix.corpus }}"
          -o "${{ runner.temp }}/afl-output"
          -V 600 --
          "fuzz/target/release/${{ matrix.target }}"
      - name: Upload crashes and hangs for minimization
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afl-${{ matrix.target }}-failures
          path: |
            ${{ runner.temp }}/afl-output/default/crashes
            ${{ runner.temp }}/afl-output/default/hangs
          if-no-files-found: ignore
          retention-days: 7
