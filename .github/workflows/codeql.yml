name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * 0"

permissions: {}

jobs:
  analyze-untrusted-pr:
    if: github.event_name == 'pull_request'
    name: Analyze untrusted PR without upload authority
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: rust
      - name: Build locked targets
        run: cargo +1.97.1 build --all-targets --all-features --locked
      - name: Analyze without uploading from untrusted code
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          upload: never

  analyze-trusted-ref:
    if: github.event_name != 'pull_request'
    name: Analyze and upload trusted ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: rust
      - name: Build locked targets
        run: cargo +1.97.1 build --all-targets --all-features --locked
      - name: Analyze
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
