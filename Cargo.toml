[package]
name = "encryptor"
autobins = false
version = "0.53.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
argon2 = "0.5"
zeroize = "1.5"
sha2 = "0.10"
poly1305 = { version = "0.8", features = ["zeroize"] }
secrecy = "0.10"
subtle = "2.6"
rpassword = "7.4"
ed25519-dalek = { version = "2", features = ["digest", "rand_core", "zeroize"] }
rand_core = { version = "0.9", features = ["os_rng", "std"] }
rustix = { version = "1.0.7", features = ["fs"] }

[dev-dependencies]
proptest = "1.9"
tempfile = "3.5"
criterion = "0.6"
chacha20poly1305 = "0.11"

[[bin]]
name = "chacha20_poly1305"
path = "src/main.rs"

[[bench]]
name = "encryptor_benchmarks"
path = "benches/encryptor_benches.rs"
harness = false
